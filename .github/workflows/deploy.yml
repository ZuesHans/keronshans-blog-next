name: Verify and Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev

  release:
    needs: check
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate committed release pin and credentials
        id: pin
        env:
          CONTENT_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          node -e 'const p=require("./release.json"); if(p.contentRepository!=="ZuesHans/keronshans-blog-content" || !/^[a-f0-9]{40}$/.test(p.contentSha)) process.exit(1); console.log("repository="+p.contentRepository); console.log("sha="+p.contentSha)' >> "$GITHUB_OUTPUT"
          test -n "$CONTENT_TOKEN" && test -n "$CF_TOKEN" && test -n "$CF_ACCOUNT" && test -n "$SITE_URL"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.sha }}
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          path: .content
          persist-credentials: false
      - run: npm ci
      - run: npm run content:verify
      - run: npm run build:cloudflare
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - name: Archive built release
        uses: actions/upload-artifact@v4
        with:
          name: worker-${{ github.sha }}-${{ steps.pin.outputs.sha }}
          path: |
            .open-next/
            release.json
          include-hidden-files: true
          retention-days: 30
      - run: npm run deploy:built
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run check:site -- "$SITE_URL"
        env:
          SITE_URL: ${{ vars.PRODUCTION_URL }}
