<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>文章 - Keronshans Archive Demo</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #fbfaf7;
        --bg-subtle: #f1eee7;
        --text: #24231f;
        --text-secondary: #4f4d47;
        --muted: #7b776f;
        --border: #ded9cf;
        --border-hover: #c5bdb0;
        --accent: #c86443;
        --accent-soft: #f6e7e1;
        --green: #5f7d68;
        --blue: #637ca4;
        --pink: #ad626b;
        --header: color-mix(in srgb, var(--bg) 94%, transparent);
        --content: 1024px;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #141d1a;
        --bg-subtle: #1b2723;
        --text: #edf3ef;
        --text-secondary: #c2cec7;
        --muted: #87968e;
        --border: #2f4039;
        --border-hover: #496258;
        --accent: #8ebda9;
        --accent-soft: #20372f;
        --green: #a6c779;
        --blue: #a8b9e3;
        --pink: #d89aaa;
        --header: color-mix(in srgb, var(--bg) 94%, transparent);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-width: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "LXGW WenKai Screen", "HarmonyOS Sans SC", "Noto Sans CJK SC", "Microsoft YaHei UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input {
        font: inherit;
      }

      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      button {
        color: inherit;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .shell {
        width: min(calc(100% - 40px), var(--content));
        margin-inline: auto;
      }

      .site-header {
        position: sticky;
        z-index: 50;
        top: 0;
        border-bottom: 1px solid var(--border);
        background: var(--header);
        backdrop-filter: blur(14px);
      }

      .header-inner {
        display: flex;
        align-items: center;
        min-height: 64px;
        gap: 24px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        min-width: 0;
        gap: 10px;
        margin-right: auto;
        font-family: Georgia, "Times New Roman", "Songti SC", serif;
        font-size: 20px;
        font-weight: 700;
      }

      .brand img {
        width: 34px;
        height: 34px;
        flex: none;
        border: 1px solid var(--border);
        border-radius: 6px;
        object-fit: cover;
      }

      .nav-links,
      .header-actions {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .nav-links a,
      .header-button,
      .menu-button {
        min-height: 36px;
        padding: 0 11px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        cursor: pointer;
        transition: color 160ms ease, background 160ms ease;
      }

      .nav-links a:hover,
      .header-button:hover,
      .menu-button:hover,
      .nav-links a.active {
        color: var(--text);
        background: var(--bg-subtle);
      }

      .header-button.icon-only {
        width: 36px;
        padding: 0;
        font-size: 16px;
      }

      .menu-button {
        display: none;
      }

      .mobile-nav {
        display: none;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 5px;
        padding-bottom: 12px;
      }

      .mobile-nav.open {
        display: grid;
      }

      .mobile-nav a {
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--text-secondary);
        text-align: center;
        font-size: 11px;
      }

      .archive-head {
        padding: 58px 0 34px;
        border-bottom: 1px solid var(--border);
      }

      .archive-kicker {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
        color: var(--accent);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .archive-kicker::before {
        width: 28px;
        height: 1px;
        background: var(--accent);
        content: "";
      }

      .archive-head h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", "Songti SC", serif;
        font-size: 45px;
        line-height: 1.15;
        font-weight: 500;
      }

      .archive-head p {
        max-width: 640px;
        margin: 13px 0 0;
        color: var(--text-secondary);
        font-size: 14px;
        line-height: 1.75;
      }

      .archive-controls {
        padding-top: 24px;
      }

      .filter-tabs {
        display: flex;
        align-items: flex-end;
        flex-wrap: wrap;
        gap: 0 24px;
        border-bottom: 1px solid var(--border);
      }

      .filter-tab {
        position: relative;
        display: inline-flex;
        align-items: baseline;
        gap: 7px;
        min-height: 43px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        cursor: pointer;
      }

      .filter-tab::after {
        position: absolute;
        right: 0;
        bottom: -1px;
        left: 0;
        height: 2px;
        background: transparent;
        content: "";
      }

      .filter-tab:hover,
      .filter-tab.active {
        color: var(--text);
      }

      .filter-tab.active::after {
        background: var(--accent);
      }

      .filter-tab span {
        color: var(--muted);
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 9px;
      }

      .search-line {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 14px;
        min-height: 64px;
        border-bottom: 1px solid var(--border);
      }

      .search-field {
        position: relative;
        min-width: 0;
      }

      .search-field::before {
        position: absolute;
        top: 50%;
        left: 0;
        color: var(--muted);
        content: "⌕";
        font-size: 17px;
        transform: translateY(-50%);
      }

      .search-field input {
        width: 100%;
        height: 44px;
        padding: 0 38px 0 25px;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text);
        font-size: 13px;
      }

      .search-field input::placeholder {
        color: var(--muted);
      }

      .clear-search {
        display: none;
        width: 30px;
        height: 30px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }

      .clear-search.visible {
        display: inline-grid;
        place-items: center;
      }

      .result-status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 52px;
        border-bottom: 1px solid var(--border);
        color: var(--muted);
        font-size: 11px;
      }

      .result-status strong {
        color: var(--text);
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 12px;
        font-weight: 500;
      }

      .list-heading,
      .post-row {
        display: grid;
        grid-template-columns: 112px minmax(0, 1fr) 220px 24px;
        gap: 18px;
        align-items: center;
      }

      .list-heading {
        min-height: 42px;
        border-bottom: 1px solid var(--border);
        color: var(--muted);
        font-size: 9px;
        text-transform: uppercase;
      }

      .post-row {
        position: relative;
        min-height: 82px;
        border-bottom: 1px solid var(--border);
        transition: background 160ms ease, box-shadow 160ms ease;
      }

      .post-row:hover {
        background: color-mix(in srgb, var(--bg-subtle) 56%, transparent);
        box-shadow: inset 3px 0 var(--accent);
      }

      .post-date {
        color: var(--muted);
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 10px;
      }

      .post-main {
        min-width: 0;
      }

      .post-meta {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 7px;
        margin-bottom: 6px;
        font-size: 9px;
      }

      .post-category {
        color: var(--accent);
        font-weight: 700;
      }

      .post-category.solution {
        color: var(--green);
      }

      .post-category.note {
        color: var(--blue);
      }

      .post-category.daily {
        color: var(--pink);
      }

      .pinned-label {
        padding: 1px 5px;
        border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
        border-radius: 3px;
        color: var(--accent);
      }

      .post-title {
        margin: 0;
        font-family: Georgia, "Times New Roman", "Songti SC", serif;
        font-size: 20px;
        line-height: 1.35;
        font-weight: 500;
        overflow-wrap: anywhere;
        transition: color 160ms ease;
      }

      .post-row:hover .post-title {
        color: var(--accent);
      }

      .post-tags {
        min-width: 0;
        overflow: hidden;
        color: var(--text-secondary);
        font-size: 12px;
        line-height: 1.5;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .post-arrow {
        color: var(--accent);
        font-size: 16px;
        text-align: right;
        transition: transform 160ms ease;
      }

      .post-row:hover .post-arrow {
        transform: translateX(3px);
      }

      .empty-state {
        display: none;
        min-height: 180px;
        place-items: center;
        border-bottom: 1px solid var(--border);
        color: var(--muted);
        font-size: 13px;
      }

      .empty-state.visible {
        display: grid;
      }

      .site-footer {
        margin-top: 46px;
        border-top: 1px solid var(--border);
      }

      .footer-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 94px;
        gap: 24px;
        color: var(--muted);
        font-size: 10px;
      }

      .footer-links {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 18px;
      }

      .footer-links a:hover {
        color: var(--accent);
      }

      @media (max-width: 820px) {
        .nav-links {
          display: none;
        }

        .menu-button {
          display: inline-flex;
          align-items: center;
        }

        .list-heading {
          display: none;
        }

        .post-row {
          grid-template-columns: minmax(0, 1fr) 24px;
          gap: 7px 12px;
          min-height: 0;
          padding: 16px 0;
        }

        .post-date {
          grid-column: 1;
          grid-row: 1;
        }

        .post-main {
          grid-column: 1 / -1;
          grid-row: 2;
        }

        .post-tags {
          grid-column: 1;
          grid-row: 3;
        }

        .post-arrow {
          grid-column: 2;
          grid-row: 1 / 4;
          align-self: center;
        }
      }

      @media (max-width: 580px) {
        .shell {
          width: min(calc(100% - 28px), 520px);
        }

        .header-inner {
          min-height: 60px;
        }

        .brand-name {
          display: none;
        }

        .archive-head {
          padding: 44px 0 28px;
        }

        .archive-head h1 {
          font-size: 37px;
        }

        .archive-head p {
          font-size: 13px;
        }

        .filter-tabs {
          flex-wrap: nowrap;
          gap: 0 20px;
          overflow-x: auto;
          scrollbar-width: none;
        }

        .filter-tabs::-webkit-scrollbar {
          display: none;
        }

        .filter-tab {
          flex: none;
          min-height: 40px;
          font-size: 11px;
        }

        .search-line {
          min-height: 56px;
        }

        .result-status {
          min-height: 46px;
        }

        .post-title {
          font-size: 19px;
        }

        .footer-inner {
          align-items: flex-start;
          flex-direction: column;
          justify-content: center;
          min-height: 108px;
          gap: 8px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>
  </head>

    <script>

      function categoryClass(category) {
        if (category === "题目复盘") return "solution";
        if (category === "学习笔记") return "note";
        if (category === "碎碎念") return "daily";
        return "";
      }

      function createPostRow(post) {
        const link = document.createElement("a");
        link.className = "post-row";
        link.href = "http://127.0.0.1:3000/posts/" + post.id;
        link.target = "_blank";
        link.rel = "noreferrer";

        const date = document.createElement("time");
        date.className = "post-date";
        date.textContent = post.date;

        const main = document.createElement("div");
        main.className = "post-main";

        const meta = document.createElement("div");
        meta.className = "post-meta";
        if (post.pinned) {
          const pinned = document.createElement("span");
          pinned.className = "pinned-label";
          pinned.textContent = "置顶";
          meta.appendChild(pinned);
        }

        const category = document.createElement("span");
        category.className = "post-category " + categoryClass(post.category);
        category.textContent = post.category;
        meta.appendChild(category);

        const title = document.createElement("h2");
        title.className = "post-title";
        title.textContent = post.title;
        main.append(meta, title);

        const tags = document.createElement("span");
        tags.className = "post-tags";
        tags.textContent = post.tags.map(function (tag) { return "#" + tag; }).join("  ");

        const arrow = document.createElement("span");
        arrow.className = "post-arrow";
        arrow.setAttribute("aria-hidden", "true");
        arrow.textContent = "→";

        link.append(date, main, tags, arrow);
        return link;
      }

      function renderPosts() {
        const query = searchInput.value.trim().toLocaleLowerCase();
        const visiblePosts = posts.filter(function (post) {
          const matchesCategory = activeCategory === "全部" || post.category === activeCategory;
          const haystack = [post.title, post.category].concat(post.tags).join(" ").toLocaleLowerCase();
          return matchesCategory && (!query || haystack.includes(query));
        });

        postList.replaceChildren(...visiblePosts.map(createPostRow));
        resultCount.textContent = String(visiblePosts.length);
        activeCategoryText.textContent = activeCategory === "全部" ? "全部分类" : activeCategory;
        clearSearch.classList.toggle("visible", Boolean(query));
        emptyState.classList.toggle("visible", visiblePosts.length === 0);
      }

      function setThemeLabel() {
        const dark = root.dataset.theme === "dark";
        themeButton.setAttribute("aria-label", dark ? "切换浅色模式" : "切换深色模式");
        themeButton.setAttribute("title", dark ? "切换浅色模式" : "切换深色模式");
      }

      tabs.forEach(function (tab) {
        tab.addEventListener("click", function () {
          activeCategory = tab.dataset.category;
          tabs.forEach(function (item) {
            const selected = item === tab;
            item.classList.toggle("active", selected);
            item.setAttribute("aria-selected", String(selected));
          });
          renderPosts();
        });
      });

      searchInput.addEventListener("input", renderPosts);
      clearSearch.addEventListener("click", function () {
        searchInput.value = "";
        searchInput.focus();
        renderPosts();
      });
      focusSearch.addEventListener("click", function () {
        searchInput.focus();
        searchInput.scrollIntoView({ block: "center", behavior: "smooth" });
      });
      themeButton.addEventListener("click", function () {
        root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
        setThemeLabel();
      });
      menuButton.addEventListener("click", function () {
        const open = mobileNav.classList.toggle("open");
        menuButton.setAttribute("aria-expanded", String(open));
      });
      document.addEventListener("keydown", function (event) {
        if ((event.ctrlKey || event.metaKey) && event.key.toLocaleLowerCase() === "k") {
          event.preventDefault();
          searchInput.focus();
        }
      });

      setThemeLabel();
      renderPosts();
    </script>
  </body>
</html>
