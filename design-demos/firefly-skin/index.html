<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Keronshans 主页视觉皮肤 Demo" />
    <title>Keronshans - 主页皮肤 Demo</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js" defer></script>
    <script src="./script.js" defer></script>
  </head>
  <body data-page="home">
    <a class="skip-link" href="#main">跳到正文</a>

    <header class="site-header" data-header>
      <div class="shell nav-inner">
        <a class="brand" href="./" aria-label="Keronshans 首页">
          <span class="brand-mark" aria-hidden="true">K</span>
          <span>Keronshans</span>
        </a>

        <nav class="desktop-nav" aria-label="主要导航">
          <a class="active" href="./">首页</a>
          <a href="./posts/">文章</a>
          <a href="http://127.0.0.1:3000/problems" target="_blank" rel="noreferrer">题单</a>
          <a href="http://127.0.0.1:3000/templates" target="_blank" rel="noreferrer">模板</a>
          <a href="http://127.0.0.1:3000/checkin" target="_blank" rel="noreferrer">打卡</a>
        </nav>

        <div class="nav-actions">
          <a
            class="icon-button"
            href="http://127.0.0.1:3000/search"
            target="_blank"
            rel="noreferrer"
            aria-label="打开全局搜索"
            title="全局搜索"
          >
            <i data-lucide="search" aria-hidden="true"></i>
          </a>
          <button class="icon-button" type="button" data-theme-toggle aria-label="切换深色模式" title="切换深色模式">
            <i data-lucide="moon" aria-hidden="true"></i>
          </button>
          <button
            class="icon-button mobile-menu-button"
            type="button"
            data-menu-toggle
            aria-expanded="false"
            aria-controls="mobileMenu"
            aria-label="打开导航"
            title="导航"
          >
            <i data-lucide="menu" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <nav class="mobile-nav" id="mobileMenu" data-mobile-menu aria-label="手机导航">
        <a href="./">首页</a>
        <a href="./posts/">文章</a>
        <a href="http://127.0.0.1:3000/problems" target="_blank" rel="noreferrer">题单</a>
        <a href="http://127.0.0.1:3000/templates" target="_blank" rel="noreferrer">模板</a>
        <a href="http://127.0.0.1:3000/checkin" target="_blank" rel="noreferrer">打卡</a>
      </nav>
    </header>

    <main id="main">
      <section class="home-hero" aria-labelledby="heroTitle">
        <div class="hero-shade" aria-hidden="true"></div>
        <div class="shell hero-content">
          <p class="hero-kicker">CP Notebook / CS Learning / Daily</p>
          <h1 id="heroTitle">Keronshans</h1>
          <p class="hero-copy">菜菜小猫的窝。算法竞赛、CS 学习笔记，还有一些正在长出来的想法。</p>
          <div class="hero-actions">
            <a class="primary-command" href="./posts/">
              <span>浏览文章</span>
              <i data-lucide="arrow-right" aria-hidden="true"></i>
            </a>
            <a class="secondary-command" href="http://127.0.0.1:3000/about" target="_blank" rel="noreferrer">关于我</a>
          </div>
        </div>
        <a class="hero-scroll" href="#latest" aria-label="查看最近更新" title="最近更新">
          <i data-lucide="chevron-down" aria-hidden="true"></i>
        </a>
      </section>

      <section class="home-band" id="latest" aria-labelledby="latestTitle">
        <div class="shell">
          <header class="section-heading">
            <div>
              <p class="section-kicker">Recently updated</p>
              <h2 id="latestTitle">最近更新</h2>
            </div>
            <a class="text-link" href="./posts/">
              <span>全部文章</span>
              <i data-lucide="arrow-up-right" aria-hidden="true"></i>
            </a>
          </header>

          <div class="home-post-grid" data-home-posts></div>
        </div>
      </section>

      <section class="category-band" aria-labelledby="categoryTitle">
        <div class="shell category-layout">
          <div>
            <p class="section-kicker">Collections</p>
            <h2 id="categoryTitle">沿着分类继续看</h2>
            <p class="section-copy">把板子、复盘和学习笔记分开收好，需要时更容易回来。</p>
          </div>
          <div class="category-links">
            <a href="./posts/?category=算法学习"><span>算法学习</span><strong>11</strong></a>
            <a href="./posts/?category=题目复盘"><span>题目复盘</span><strong>14</strong></a>
            <a href="./posts/?category=学习笔记"><span>学习笔记</span><strong>3</strong></a>
            <a href="./posts/?category=碎碎念"><span>碎碎念</span><strong>3</strong></a>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="shell footer-inner">
        <span>© 2026 Keronshans</span>
        <div>
          <a href="./posts/">文章</a>
          <a href="http://127.0.0.1:3000/about" target="_blank" rel="noreferrer">关于</a>
          <a href="#main">回到顶部</a>
        </div>
      </div>
    </footer>
  </body>
</html>
